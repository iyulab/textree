[package]
name = "textree"
version = "0.6.0"
description = "A local-first note app that keeps notes as plain files"
authors = ["iyulab"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "textree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
# Atomic note writes (temp + rename), so a crash mid-write cannot truncate a note.
tempfile = "3"
notify-debouncer-full = "0.7.0"
# Pasted image attachments: decodes the binary that crosses IPC as a base64 string.
base64 = "0.22"
# Full-text index over note bodies. An n-gram tokenizer gives partial matches in scripts
# that do not separate words with spaces.
tantivy = "0.22"
# Hashes the vault root path into an index directory name, and builds the PKCE S256 challenge.
sha2 = "0.10"
# In-app web-publish auth (slice 2c): CSPRNG for the PKCE code_verifier + loopback state nonce.
getrandom = "0.2"
tauri-plugin-process = "2.3.1"
# Lightweight blocking HTTP for loopback sidecar health-check; no TLS needed.
ureq = { version = "2.10", features = ["json"] }
# Windows Credential Manager for BYO API keys — never written to disk in plaintext (D16).
keyring = "4"
# Direct deps on keyring's own store-init building blocks: keyring 4.1.3's `v1::Entry::new()`
# convenience shim has a confirmed upstream bug (an inverted `compare_exchange` guard, see
# https://github.com/open-source-cooperative/keyring-rs — the store-install branch is dead code)
# that leaves the default store unset, so bare `keyring::Entry` fails on every platform with
# "No default store has been set". We replicate the shim's own (otherwise-correct) init body
# ourselves in byo_secret.rs. Versions match what keyring 4.1.3 already resolves transitively —
# no duplicate versions in the dependency tree.
keyring-core = "1"
# Structured logging to the OS app log directory (app_log_dir). The `log` facade
# (log::info!/warn!/error!) is used at call sites; the plugin wires the backend.
log = "0.4"
tauri-plugin-log = "2"
# Zip the locally-rendered canopy bundle before uploading it to api.textree.me/publish (slice 2b).
# Deflate-only: we just Deflate-compress the bundle, so drop the default features (bzip2/lzma/zstd/aes,
# some needing a native toolchain) to keep the supply-chain/attack surface minimal (constitution: minimal deps).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Embedded git engine. The C library is vendored and statically linked into the executable;
# it is never shipped as a separate artifact. The feature set is deliberately minimal — no
# `https` and no `ssh` — so no TLS or SSH native libraries enter the binary. The
# `dependency_policy` test enforces that. See THIRD-PARTY-NOTICES.md.
git2 = { version = "0.21", features = ["vendored-libgit2"] }

[target."cfg(windows)".dependencies]
tauri-plugin-updater = "2.10.1"
# Workaround dep for the keyring 4.1.3 store-init bug — see the `keyring-core` comment above.
windows-native-keyring-store = "1"

