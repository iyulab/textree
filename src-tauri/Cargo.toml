[package]
name = "textree"
version = "0.7.0"
description = "A local-first note app that keeps notes as plain files"
authors = ["iyulab"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "textree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
# Atomic note writes (temp + rename), so a crash mid-write cannot truncate a note.
tempfile = "3"
# Crash-safe writes of this app's own settings, outside the notes folder.
tauri-kit-fs = "0.6"
# Changes other programs make to the notes folder, without the app's own writes.
tauri-kit-watch = "0.6"
# Pasted image attachments: decodes the binary that crosses IPC as a base64 string.
base64 = "0.22"
# Full-text index over note bodies. An n-gram tokenizer gives partial matches in scripts
# that do not separate words with spaces.
tantivy = "0.26"
# Hashes the vault root path into an index directory name, and builds the PKCE S256 challenge.
sha2 = "0.10"
# In-app web-publish auth (slice 2c): CSPRNG for the PKCE code_verifier + loopback state nonce.
getrandom = "0.2"
tauri-plugin-process = "2.3.1"
# Lightweight blocking HTTP for loopback sidecar health-check; no TLS needed.
ureq = { version = "3", features = ["json"] }
# Secrets (BYO API key, publish token, remote credentials) in the OS credential store, never on
# disk in plaintext. Test runs and development builds get entries of their own.
tauri-kit-credentials = "0.6"
# The local AI helper process: no console window, stopped together with everything it starts
# (also when this app crashes), and a free loopback port for it to listen on.
tauri-kit-sidecar = "0.6"
# Structured logging to the OS app log directory (app_log_dir). The `log` facade
# (log::info!/warn!/error!) is used at call sites; the plugin wires the backend.
log = "0.4"
tauri-plugin-log = "2"
# Zip the locally-rendered canopy bundle before uploading it to api.textree.me/publish (slice 2b).
# Deflate-only: we just Deflate-compress the bundle, so drop the default features (bzip2/lzma/zstd/aes,
# some needing a native toolchain) to keep the supply-chain/attack surface minimal.
zip = { version = "8", default-features = false, features = ["deflate"] }
# Embedded git engine. The C library is vendored and statically linked into the executable;
# it is never shipped as a separate artifact. The feature set is deliberately minimal — no
# `https` and no `ssh` — so no TLS or SSH native libraries enter the binary. The
# `dependency_policy` test enforces that. See THIRD-PARTY-NOTICES.md.
git2 = { version = "0.21", features = ["vendored-libgit2"] }

[target."cfg(windows)".dependencies]
tauri-plugin-updater = "2.10.1"
# Renaming without replacing (MoveFileExW with no REPLACE flag) — std::fs::rename always replaces.
# Already in the graph through tauri; no new code ships.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

