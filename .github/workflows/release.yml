name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Speeds up recurring builds. cache-on-failure saves the cache even when the job fails, so a
      # cold first run that overruns the Key Vault token TTL (~60-90 min) recovers fast on re-trigger.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      # Acquire canopy at a pinned commit so the sidecar payload is reproducible.
      # Bump the ref deliberately when picking up new canopy features.
      # The pinned canopy commit lives in .github/canopy-ref, read by both CI and release, so the
      # canopy that CI tests is the canopy that ships. Bump it deliberately, in that one file.
      - name: Read pinned canopy commit
        id: canopy
        shell: bash
        # Refuse anything but a full commit hash: an empty ref would check out canopy's default
        # branch and build, green, against an unpinned canopy.
        run: |
          ref=$(tr -d '[:space:]' < .github/canopy-ref) || exit 1
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=.github/canopy-ref::must hold a full 40-character commit hash, got '$ref'"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout canopy (pinned)
        uses: actions/checkout@v7
        with:
          repository: iyulab/canopy
          ref: ${{ steps.canopy.outputs.ref }}
          path: canopy-src

      # Builds canopy and copies the output into src-tauri/resources/canopy/
      # so tauri-action bundles it in the installer (Task 3 resources map).
      - name: Assemble canopy sidecar
        shell: pwsh
        run: pwsh -NoProfile -File scripts/assemble-canopy-sidecar.ps1 -CanopyPath ${{ github.workspace }}/canopy-src

      # Publish the .NET host self-contained and stage it under src-tauri/resources/host/
      # so tauri-action bundles it (Task 4 resources map). Must run BEFORE any cargo build:
      # tauri.conf.json bundle.resources requires both resources/canopy AND resources/host to
      # exist, so the verify-publish build below fails on a missing resource path otherwise.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Assemble host sidecar
        shell: pwsh
        run: pwsh -NoProfile -File scripts/assemble-host-sidecar.ps1

      # Guards: run the gated integration tests to confirm both assembled payloads are
      # complete before the build + sign step consumes them.
      - name: Verify bundled sidecar publishes
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored run_publish_via_assembled_sidecar

      - name: Verify bundled host present
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored run_host_present_via_assembled_sidecar

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: 293d5452-469f-4988-93c9-0aee0f2d0846
          tenant-id: 66683f75-fa9e-4325-84e1-9253c1fc8cb7
          allow-no-subscriptions: true

      - name: Install AzureSignTool
        run: dotnet tool install --global AzureSignTool

      - name: Acquire Key Vault access token
        shell: pwsh
        run: |
          $token = az account get-access-token --resource https://vault.azure.net --query accessToken -o tsv
          echo "::add-mask::$token"
          echo "AZURE_KV_TOKEN=$token" >> $env:GITHUB_ENV

      - name: Build, sign, and release
        uses: tauri-apps/tauri-action@v0
        env:
          AZURE_KV_URL: https://kv-codesign-iyulab.vault.azure.net/
          AZURE_KV_CERT: globalsign-ev-codesign
          AZURE_TIMESTAMP_URL: http://timestamp.globalsign.com/tsa/r6advanced1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tagName: ${{ github.ref_name }}
          releaseName: 'Textree ${{ github.ref_name }}'
          releaseDraft: true  # GitHub "latest" excludes drafts; auto-update sees this only after a human publishes
          prerelease: false
          args: --target x86_64-pc-windows-msvc
