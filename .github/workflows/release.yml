name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Speeds up recurring builds. cache-on-failure saves the cache even when the job fails, so a
      # cold first run that overruns the Key Vault token TTL (~60-90 min) recovers fast on re-trigger.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      # The canopy release lives in canopy-sidecar/ (package.json + package-lock.json), read by
      # both CI and release through the same script, so the canopy CI tests is the canopy that ships.
      # Installs the pinned canopy release into src-tauri/resources/canopy/
      # so tauri-action bundles it in the installer (the `resources` map in tauri.conf.json).
      - name: Assemble canopy sidecar
        shell: pwsh
        run: pwsh -NoProfile -File scripts/assemble-canopy-sidecar.ps1

      # Publish the .NET host self-contained and stage it under src-tauri/resources/host/
      # so tauri-action bundles it (the `resources` map in tauri.conf.json). Must run BEFORE any cargo build:
      # tauri.conf.json bundle.resources requires both resources/canopy AND resources/host to
      # exist, so the verify-publish build below fails on a missing resource path otherwise.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Assemble host sidecar
        shell: pwsh
        run: pwsh -NoProfile -File scripts/assemble-host-sidecar.ps1

      # Guards: run the gated integration tests to confirm both assembled payloads are
      # complete before the build + sign step consumes them.
      - name: Verify bundled sidecar publishes
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored run_publish_via_assembled_sidecar

      - name: Verify bundled host present
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored run_host_present_via_assembled_sidecar

      # Prepares the job for signing: Azure login (OIDC) and a pinned AzureSignTool, then puts
      # `code-sign-file.cmd` on PATH — the sign hook in src-tauri/tauri.sign.conf.json. Each call takes a
      # Key Vault token from `az` for that one file, so no token is left in the environment for the
      # steps that follow. Run right before the build: the login cannot be renewed after about an hour.
      - name: Prepare code signing
        uses: iyulab/code-sign@c4c68c25295ce0010a396d54cdb017fd248c5cce # main
        with:
          description: Textree
          description-url: https://github.com/iyulab/textree

      - name: Build, sign, and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tagName: ${{ github.ref_name }}
          releaseName: 'Textree ${{ github.ref_name }}'
          releaseDraft: true  # GitHub "latest" excludes drafts; auto-update sees this only after a human publishes
          prerelease: false
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.sign.conf.json

      # makensis ignores a failing sign command, so a broken signature would otherwise ship unnoticed.
      - name: Verify the installer is signed
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Recurse -Path src-tauri/target -Filter '*-setup.exe' | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $installer) { throw 'no installer was built' }
          $sig = Get-AuthenticodeSignature $installer.FullName
          Write-Host "$($installer.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            if (Test-Path $env:CODE_SIGN_LOG) { Get-Content $env:CODE_SIGN_LOG }
            throw "the installer's signature is $($sig.Status)"
          }
