name: CI

# Verification gates for every push to main and every pull request.
# Verify-only: no artifacts are uploaded here (release/bindings pipelines own that).
#
# Runs on windows-latest because Textree is Windows-first (Tauri + WebView2) today.
# Multi-OS CI is deferred until the cross-platform debt is addressed.
#
# The Playwright E2E suite is intentionally NOT run in CI: it attaches over CDP to a
# live WebView2 of the running Tauri app, which needs a GUI session. E2E stays a
# local/manual gate (see e2e/README.md).

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The compiler is part of the key: target/ built by one rustc is dead weight to the next, and
      # the runner image moves its preinstalled toolchain on its own schedule.
      - name: Read rustc version
        id: rustc
        shell: bash
        run: echo "version=$(rustc -V | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ steps.rustc.outputs.version }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.rustc.outputs.version }}-cargo-

      - name: Install dependencies
        run: npm ci

      # Gate on what ships: runtime dependencies end up in the app bundle, dev tooling does not.
      # Known advisories in dev tooling are reported by `npm audit` locally but do not fail CI;
      # a high-severity advisory in a runtime dependency does.
      - name: No high-severity advisories in runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Third-party notices are generated from the shipped dependency graphs, so they
      # go stale the moment a dependency is added or bumped. This reads metadata only
      # (no build), which is why it can run first and fail fast.
      - name: Third-party notices match the dependency graph
        run: npm run notices:check

      # Nothing that only means something in the workspace this was written from should reach a
      # public repository. Reads tracked files only, so it is as fast as the notices check and
      # fails for the same reason: a sweep nobody runs is a sweep that has already rotted.
      - name: No workspace-only text in tracked files
        run: npm run tokens:check

      - name: Type check (svelte-check, 0 errors / 0 warnings)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build frontend (vite, adapter-static)
        run: npm run build

      # cargo test builds the Tauri crate, whose tauri.conf.json bundle.resources
      # requires BOTH resources/canopy AND resources/host to exist — otherwise the
      # build script fails with "resource path doesn't exist". Assemble both sidecars
      # before cargo, mirroring release.yml (without that step this job was permanently red).
      # The canopy release lives in canopy-sidecar/ (package.json + package-lock.json), read by
      # both CI and release through the same script, so the canopy CI tests is the canopy that ships.
      - name: Assemble canopy sidecar
        shell: pwsh
        run: pwsh -NoProfile -File scripts/assemble-canopy-sidecar.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The host's fast-moving package families are held to their current line — the pinned ones
      # and the ones that arrive only through them, read from the restored graph. Falling behind is
      # silent — restore, build and tests stay green on an old pin — so it is checked here, with
      # expiring waivers as the only way to carry a known gap.
      - name: Restore host packages
        run: dotnet restore src-host/TextreeHost.slnx

      - name: Host package pins within drift threshold
        run: npm run pins:check

      - name: Assemble host sidecar
        shell: pwsh
        run: pwsh -NoProfile -File scripts/assemble-host-sidecar.ps1

      - name: Rust tests (cargo)
        run: cargo test --manifest-path src-tauri/Cargo.toml
