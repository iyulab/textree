[workspace]
resolver = "2"
members = ["crates/textree", "crates/textree-folder", "crates/textree-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/iyulab/textree"
rust-version = "1.80"

[workspace.dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
